<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="matrixFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#39ff14;stop-opacity:0.18"/>
      <stop offset="60%" style="stop-color:#39ff14;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#39ff14;stop-opacity:0"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="42%" r="45%" fx="50%" fy="42%">
      <stop offset="0%" style="stop-color:#39ff14;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#39ff14;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>
  <rect width="1200" height="630" fill="url(#centerGlow)"/>

  <!-- Matrix rain columns -->
  <g fill="url(#matrixFade)" font-family="monospace" font-size="13" opacity="0.5">
    <text x="40" y="60">01001000</text>
    <text x="40" y="110">10110101</text>
    <text x="40" y="160">00101010</text>
    <text x="40" y="210">11001100</text>
    <text x="40" y="260">01010101</text>
    <text x="140" y="30">11010010</text>
    <text x="140" y="80">01101001</text>
    <text x="140" y="130">10010110</text>
    <text x="140" y="180">01011010</text>
    <text x="140" y="230">10101001</text>
    <text x="240" y="50">00110011</text>
    <text x="240" y="100">10101010</text>
    <text x="240" y="150">01010101</text>
    <text x="240" y="200">11001011</text>
    <text x="920" y="380">01001000</text>
    <text x="920" y="430">10110101</text>
    <text x="920" y="480">00101010</text>
    <text x="920" y="530">11001100</text>
    <text x="920" y="580">01010101</text>
    <text x="1020" y="400">11010010</text>
    <text x="1020" y="450">01101001</text>
    <text x="1020" y="500">10010110</text>
    <text x="1020" y="550">01011010</text>
    <text x="1100" y="420">00110011</text>
    <text x="1100" y="470">10101010</text>
    <text x="1100" y="520">01010101</text>
    <text x="1100" y="570">11001011</text>
  </g>

  <!-- CyberKhoj title -->
  <text x="600" y="240" text-anchor="middle" font-family="Syne, sans-serif" font-size="80" font-weight="800" fill="#39ff14" filter="url(#textGlow)">
    CyberKhoj
  </text>

  <!-- Tagline -->
  <text x="600" y="310" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="28" fill="#e0e0e0" letter-spacing="0.08em">
    Free AI Bug Bounty Tool
  </text>

  <!-- Subtitle -->
  <text x="600" y="360" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="18" fill="#71717a" letter-spacing="0.05em">
    Search. Find. Exploit Responsibly.
  </text>

  <!-- Separator line -->
  <line x1="350" y1="400" x2="850" y2="400" stroke="#39ff14" stroke-width="2" opacity="0.3"/>

  <!-- Feature highlights -->
  <g font-family="Share Tech Mono, monospace" font-size="16" fill="#a1a1aa">
    <text x="210" y="450" text-anchor="middle">URL Analyzer</text>
    <text x="440" y="450" text-anchor="middle">Attack Mode</text>
    <text x="660" y="450" text-anchor="middle">Mind Map</text>
    <text x="880" y="450" text-anchor="middle">Recon Dashboard</text>
  </g>

  <!-- Feature dots -->
  <circle cx="325" cy="445" r="3" fill="#39ff14" opacity="0.5"/>
  <circle cx="550" cy="445" r="3" fill="#39ff14" opacity="0.5"/>
  <circle cx="770" cy="445" r="3" fill="#39ff14" opacity="0.5"/>

  <!-- Bottom text -->
  <text x="600" y="510" text-anchor="middle" font-family="Share Tech Mono, monospace" font-size="14" fill="#525252">
    Free Forever • 1000 Analyses/Day • No Signup • 100% Private
  </text>

  <!-- Corner accents -->
  <path d="M30 30 L30 70 M30 30 L70 30" stroke="#39ff14" stroke-width="3" opacity="0.5"/>
  <path d="M1170 30 L1170 70 M1170 30 L1130 30" stroke="#39ff14" stroke-width="3" opacity="0.5"/>
  <path d="M30 600 L30 560 M30 600 L70 600" stroke="#39ff14" stroke-width="3" opacity="0.5"/>
  <path d="M1170 600 L1170 560 M1170 600 L1130 600" stroke="#39ff14" stroke-width="3" opacity="0.5"/>
</svg>
