<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="iconGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark background with rounded corners -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="#0a0a0a"/>
  
  <!-- Subtle inner glow -->
  <rect x="16" y="16" width="480" height="480" rx="80" fill="url(#iconGlow)" opacity="0.5"/>
  
  <!-- Border -->
  <rect x="8" y="8" width="496" height="496" rx="88" fill="none" stroke="#22c55e" stroke-width="4" opacity="0.3"/>
  
  <!-- Terminal cursor block -->
  <g filter="url(#glow)">
    <rect x="160" y="128" width="192" height="256" rx="16" fill="#22c55e"/>
  </g>
  
  <!-- Underscore detail -->
  <rect x="176" y="408" width="160" height="16" rx="4" fill="#22c55e" opacity="0.6"/>
</svg>
